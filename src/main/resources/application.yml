server:
  port: 8080
  forward-headers-strategy: native

spring:
  application:
    name: ms-rufe

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  transaction:
    rollback-on-error: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  packages-to-scan: co.rufe.rufe

application:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:28800000} # 8 hours in ms

logging:
  level:
    com.rufe: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.jdbc.core: DEBUG
    org.apache.coyote: DEBUG

app:
  dataloader:
    enabled: ${APP_DATALOADER_ENABLED:false}
    force-reset: ${APP_DATALOADER_FORCE_RESET:false}
    i-am-sure: ${APP_DATALOADER_I_AM_SURE:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4000}
  storage:
    local-dir: ${APP_STORAGE_LOCAL_DIR:c:/rufe/evidences}

aws:
  s3:
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:9000}
    access-key: ${AWS_ACCESS_KEY_ID:minioadmin}
    secret-key: ${AWS_SECRET_ACCESS_KEY:minioadmin}
    bucket-name: ${AWS_BUCKET_NAME:rufe-evidences}
    region: ${AWS_REGION:us-east-1}
